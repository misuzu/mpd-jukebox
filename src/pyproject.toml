[project]
name = "mpd-jukebox"
version = "0.1"
description = "Keeps MPD's queue filled with random songs or albums, like myMPD's jukebox"
license = "MIT"

requires-python = ">= 3.11"

dependencies = [
  "aiosqlite >= 0.21, < 0.23",
  "click >= 8.1.1, < 9",
  "python-mpd2 >= 3.1.2, < 3.2",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-mypy",
  "pytest-ruff",
]

[project.scripts]
mpd-jukebox = "mpd_jukebox.cli:main"

[build-system]
requires = ["flit_core >=3.12,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.sdist]
include = ["mpd_jukebox/"]
exclude = ["tests/"]

[tool.coverage.report]
omit = [
  "tests/*",
]
precision = 1
skip_covered = true
skip_empty = true
show_missing = true

[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true
warn_return_any = true

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
addopts = [
  "-p no:cacheprovider",

  "--durations=10",
  "--durations-min=1.0",

  "-p pytest_cov",
  "--no-cov-on-fail",
  "--cov=mpd_jukebox",
  "--cov-fail-under=95",

  "--mypy",

  "--ruff",
  "--ruff-format",
]
